[project]
name = "flybrain-connectome-mcp"
version = "1.3.0"
description = "Query/analyze the Drosophila MaleCNS connectome via MCP stdio or a zero-dependency HTTP API (apikey auth)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pyarrow"]

[project.scripts]
flybrain-mcp-server = "mcp_connectome.server:main"
flybrain-mcp-api = "mcp_connectome.api_server:main"

[tool.setuptools]
packages = ["mcp_connectome"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
