# pre-commit hooks — run `pre-commit install` once, then every `git commit`
# runs these automatically on staged files. The heavy gates (ruff on the whole
# tree, full pytest, mypy) are in `make lint test typecheck`, not here —
# pre-commit is for things that must never silently regress between commits.
#
# Install:
#   pip install -e ".[dev]"
#   pre-commit install
#   pre-commit run --all-files   # bootstrap

default_stages: [commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length=100]

  # Refuse to commit any of the secret patterns check_no_secrets.py also catches.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline=.secrets.baseline"]
        exclude: |
          (?x)^(
            flybrain-connectome-mcp/mcp_connectome/config\.json|
            config\.local\.json|
            tmp/.+|
            archive/.+|
            docs/.*secret.*
          )$
