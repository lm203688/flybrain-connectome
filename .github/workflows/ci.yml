name: ci

# The gates in this repo are all *offline*: they never download the 5.63 GB
# MaleCNS dataset. Two job families:
#
#   gates   - the repo's own quality gates (secrets / docs drift / MCP tools),
#             run on every supported Python version
#   package - proves the README install path actually works, which cannot be
#             verified in a sandbox where `pip install` is silently blocked
#
# `workflow_dispatch` is deliberate: it lets the maintainer re-run the suite
# on demand without pushing an empty commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: offline gates / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10 in pyproject.toml — test the floor,
        # the middle, and the newest we claim to support.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # core.py imports numpy at module level, so anything that talks to the
      # connectome engine needs it. pyarrow is imported lazily and is only
      # needed by the real-data tools, which --offline skips.
      #
      # dataprov is what serializes the W3C PROV-JSON bundle. It is OPTIONAL
      # at runtime, but installing it here is deliberate: CI is the only place
      # that exercises the provenance claim, and a build that silently stops
      # emitting provenance must not look green.
      - name: Install runtime + provenance dependencies
        run: python -m pip install --upgrade pip numpy dataprov

      - name: Every Python file compiles
        run: |
          python -m compileall -q \
            flybrain_cli.py \
            flybrain-connectome-mcp \
            integrations \
            scripts
          echo "compileall: OK"

      - name: "Gate 1 - no hardcoded credentials"
        run: python scripts/check_no_secrets.py

      - name: "Gate 2 - docs match code"
        run: python scripts/check_docs_consistency.py

      - name: "Gate 3 - every advertised MCP tool responds"
        run: python scripts/check_mcp_tools.py --offline

      # A missing *optional* dependency must degrade, not crash. This ran red
      # on the first CI attempt: get_provenance_bundle died with
      # "'NoneType' object has no attribute 'keys'" because prov_json is an
      # explicit None without dataprov. Every dev machine had dataprov, so no
      # local run could ever have caught it.
      - name: "Gate 4 - optional dependency absent degrades honestly"
        run: python scripts/check_degraded_mode.py

      - name: CLI self-check
        run: python flybrain_cli.py info

      - name: Generator smoke test (no dataset needed)
        run: |
          python flybrain_cli.py generate \
            --motif-source local \
            --blueprint predictive_coding_v2 \
            --modules 3 \
            --agents-per-module 4 \
            --name ci_smoke \
            --out /tmp/ci_out \
            --no-html

      # Assert the artifact's *content*, not just that the command exited 0 —
      # "the process returned success" is exactly how dead outputs hide.
      # The checker asserts real invariants (no dangling edges, leader outside
      # every module, weights in range, provenance chain intact) and was itself
      # self-tested: 6 mutations injected, 6 caught.
      - name: "Gate 5 - the generated artifact is real"
        run: python scripts/check_generated_artifact.py --dir /tmp/ci_out --name ci_smoke

      # Phase 4/5/6: variant differentiation, SwarmLabs integration, market CRUD
      - name: "Gate 6 - Phase 4/5/6 features (variants + SwarmLabs + market)"
        run: |
          python -c "
          import sys, json, os
          sys.path.insert(0, 'flybrain-connectome-mcp')
          os.environ['FLYBRAIN_DATA_DIR'] = '/tmp/nonexistent'  # force offline

          from synthetic_bio_topology import MODULE_PROFILES, BLUEPRINTS
          from module_registry import ModuleFactory, MODULE_REGISTRY, PRESETS

          # 1. Variant true differentiation: same module, different params
          v_profiles = [k for k in MODULE_PROFILES if any(k.startswith(m + '_') for m in MODULE_REGISTRY)]
          assert len(v_profiles) >= 3, f'Expected variant profiles, got {v_profiles}'
          print(f'  variant profiles: {v_profiles[:5]}...')

          # 2. Compose with variants and blueprint
          result = ModuleFactory.compose_organism({
              'modules': ['sensory', 'memory', 'motor'],
              'counts': {'sensory': 3},
              'variants': {'sensory': ['vision', 'sound', 'touch']},
              'blueprint': 'hierarchical_deep',
              'agents_per_module': 3,
              'seed': 42,
          })
          assert result['status'] == 'success', f'compose failed: {result.get(\"error\")}'
          stats = result['stats']
          assert stats['total_nodes'] > 0
          assert stats['blueprint_edges_added'] > 0, 'No blueprint edges added'
          assert stats['n_variants_applied'] == 3, f'Expected 3 variants, got {stats[\"n_variants_applied\"]}'
          print(f'  composed: {stats[\"total_nodes\"]} nodes, {stats[\"total_edges\"]} edges, '
                f'{stats[\"blueprint_edges_added\"]} bp edges, {stats[\"n_variants_applied\"]} variants')

          # 3. SwarmLabs integration
          from synthetic_bio_topology import build_swarmlabs_config
          swarm = build_swarmlabs_config(result['organism'])
          assert swarm['schema_version'] == '1.2.1'
          assert len(swarm['agents']) > 0
          assert len(swarm['edges']) > 0
          assert swarm['validation']['ok'] is True
          print(f'  swarmlabs: {len(swarm[\"agents\"])} agents, {len(swarm[\"edges\"])} edges, ok={swarm[\"validation\"][\"ok\"]}')

          # 4. Module agent roles mapping
          roles = ModuleFactory.get_module_agent_roles()
          assert len(roles) == 19, f'Expected 19 module roles, got {len(roles)}'
          print(f'  module roles: {len(roles)} modules mapped')

          # 5. Market CRUD
          market_dir = '/tmp/test_market'
          os.makedirs(market_dir, exist_ok=True)
          ModuleFactory.save_market_organism('test_organism', result['organism'], tags=['test', 'ci'])
          loaded = ModuleFactory.load_market_organism('test_organism')
          assert loaded['organism']['name'] == 'test_organism'
          listed = ModuleFactory.list_market_organisms(tag='test')
          assert len(listed) >= 1
          rated = ModuleFactory.rate_market_organism('test_organism', 5, 'ci test')
          assert rated['average_rating'] == 5.0
          searched = ModuleFactory.search_market_organisms('test')
          assert len(searched) >= 1
          ModuleFactory.delete_market_organism('test_organism')
          print('  market: save/load/list/rate/search/delete all OK')

          # 6. All presets with blueprint still work
          preset_failures = []
          for pname in PRESETS:
              try:
                  r = ModuleFactory.apply_preset(pname)
                  if r['status'] != 'success':
                      preset_failures.append(f'{pname}: {r.get(\"error\")}')
              except Exception as e:
                  preset_failures.append(f'{pname}: {type(e).__name__}: {e}')
          if preset_failures:
              for f in preset_failures:
                  print(f'  PRESET FAIL: {f}')
              sys.exit(1)
          print(f'  all {len(PRESETS)} presets: PASS')

          print('GATE 6: PASS')
          "

  package:
    name: packaged CLI / pip install .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This is the claim the README makes. It is testable here and nowhere
      # else we have access to, so it runs on every push.
      #
      # Installing the [prov] extra does double duty: it proves the optional
      # extra declared in pyproject.toml actually resolves, and it gives the
      # artifact gate below a real PROV bundle to assert on.
      - name: pip install ".[prov]"
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[prov]"

      - name: The console script is on PATH and runs
        run: flybrain --help

      - name: Installed CLI resolves the toolkit via FLYBRAIN_HOME
        run: FLYBRAIN_HOME="$PWD" flybrain info

      - name: Installed CLI can generate without the dataset
        run: |
          FLYBRAIN_HOME="$PWD" flybrain generate \
            --motif-source local \
            --modules 2 \
            --agents-per-module 3 \
            --name pkg_smoke \
            --out /tmp/pkg_out \
            --no-html

      - name: "Gate 5 - the installed CLI produced a real artifact"
        run: python scripts/check_generated_artifact.py --dir /tmp/pkg_out --name pkg_smoke

  # A single required check is far easier to gate a branch on than a matrix.
  ci:
    name: ci
    if: always()
    needs: [gates, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          echo "gates=${{ needs.gates.result }} package=${{ needs.package.result }}"
          test "${{ needs.gates.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
